<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 | Manipulación DHTML</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos separados obligatorios -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">

    <div class="container" style="max-width: 800px;">
        <div class="card custom-card p-4 shadow-lg mb-4">
            <h3 class="fw-bold text-primary mb-2">1. Interacciones Dinámicas DOM</h3>
                        
            <!-- Botonera de Accesos -->
            <div class="row g-2 mb-4">
                <div class="col-12 col-sm-4">
                    <button id="btnCrearH1" class="btn btn-outline-success w-100 py-2 fw-medium">Agregar H1</button>
                </div>
                <div class="col-12 col-sm-4">
                    <button id="btnCambiarH1" class="btn btn-outline-warning w-100 py-2 fw-medium">Cambiar Texto H1</button>
                </div>
                <div class="col-12 col-sm-4">
                    <button id="btnColorH1" class="btn btn-outline-info w-100 py-2 fw-medium">Cambiar Color H1</button>
                </div>
                <div class="col-12 col-sm-4">
                    <button id="btnCrearImg" class="btn btn-outline-success w-100 py-2 fw-medium">Agregar Imagen</button>
                </div>
                <div class="col-12 col-sm-4">
                    <button id="btnCambiarImg" class="btn btn-outline-warning w-100 py-2 fw-medium">Cambiar Imagen</button>
                </div>
                <div class="col-12 col-sm-4">
                    <button id="btnTamanoImg" class="btn btn-outline-info w-100 py-2 fw-medium">Cambiar Tamaño Img</button>
                </div>
            </div>

            <!-- Zona de Renderizado Estructural -->
            <div id="renderZone" class="d-flex flex-column align-items-center justify-content-center gap-3">
                <p id="placeholderText" class="text-muted m-0 italic-placeholder">Los nodos generados por eventos aparecerán en este contenedor.</p>
            </div>
        </div>
    </div>

    <!-- Contenedor de Toasts Fijos Abajo a la Derecha (Acumulables hasta 3) -->
    <div id="toastStackContainer" class="toast-container position-fixed bottom-0 end-0 p-3 d-flex flex-column gap-2" style="z-index: 1080;"></div>

    <!-- Burbuja de Acciones Flotantes (Tema + Top Scroll) -->
    <div class="floating-actions">
        <button id="btnScrollTop" class="btn btn-primary btn-floating" aria-label="Volver arriba" title="Volver arriba">▲</button>
        <button id="themeToggle" class="btn btn-light btn-floating" aria-label="Cambiar tema" title="Cambiar tema"><span id="themeIcon">☀️</span></button>
    </div>

    <!-- Scripts separados obligatorios -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
