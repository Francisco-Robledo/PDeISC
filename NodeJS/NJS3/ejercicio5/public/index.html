<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inyección por innerHTML Completa</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #scrollTopBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- Navbar con Modo Oscuro -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand">Proyecto innerHTML</span>
            <button id="themeToggle" class="btn btn-dark">Modo Oscuro</button>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="mb-4 text-center">Inyector de Elementos</h1>
        
        <div class="row">
            <!-- Columna de Botones (Ocupa 4 columnas en PC, 12 en celulares) -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-body d-flex flex-column gap-2">
                        <h5 class="card-title text-center mb-3">Controles</h5>
                        <button id="btnCard" class="btn btn-primary">Agregar Tarjeta</button>
                        <button id="btnAlert" class="btn btn-warning">Agregar Alerta</button>
                        <button id="btnProgress" class="btn btn-success">Agregar Progreso</button>
                        <hr>
                        <button id="btnClear" class="btn btn-danger">Limpiar Todo</button>
                    </div>
                </div>
            </div>

            <!-- Columna del Contenedor HTML (Ocupa 8 columnas en PC, 12 en celulares) -->
            <div class="col-md-8">
                <div id="htmlContainer" class="p-4 bg-body-tertiary border rounded shadow-sm min-vh-100">
                    <p class="text-muted text-center" id="emptyMessage">Hacé click en los botones para agregar elementos acá...</p>
                </div>
            </div>
        </div>
        
        <!-- Espacio extra para forzar el scroll y probar el botón -->
        <div style="height: 500px;" class="d-flex align-items-end justify-content-center pb-5">
            <p class="text-muted">Fin del documento</p>
        </div>
    </div>

    <!-- Botón Top Scroll -->
    <button id="scrollTopBtn" class="btn btn-primary rounded-circle p-3">↑</button>

    <!-- Bootstrap Bundle JS (para que funcione el botón de cerrar en la alerta) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
