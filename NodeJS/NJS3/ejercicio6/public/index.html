<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro Dinamico con HTML5</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #scrollTopBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none;
            z-index: 1000;
        }

        .page-shell {
            max-width: 1140px;
        }

        .theme-bar {
            gap: 12px;
        }

        .form-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
        }

        .form-options .form-check {
            margin-right: 0;
        }

        @media (max-width: 991.98px) {
            .results-card {
                position: static !important;
                height: auto !important;
            }
        }

        @media (max-width: 575.98px) {
            body {
                font-size: 0.95rem;
            }

            .navbar {
                margin-bottom: 1rem !important;
            }

            .theme-bar {
                align-items: stretch;
                flex-direction: column;
            }

            .theme-bar .navbar-brand {
                margin-right: 0;
                text-align: center;
            }

            #themeToggle,
            #registrationForm button[type="submit"] {
                width: 100%;
            }

            h1 {
                font-size: 1.6rem;
            }

            .card-body {
                padding: 1rem;
            }

            .form-options {
                flex-direction: column;
                gap: 8px;
            }

            #scrollTopBtn {
                bottom: 14px;
                right: 14px;
                padding: 0.65rem 0.85rem !important;
            }
        }
    </style>
</head>
<body class="bg-body-tertiary">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4">
        <div class="container-fluid theme-bar">
            <span class="navbar-brand">Proyecto Formulario</span>
            <button id="themeToggle" class="btn btn-dark">Modo Oscuro</button>
        </div>
    </nav>

    <div class="container page-shell">
        <h1 class="text-center mb-4">Registro de Usuario</h1>

        <div class="row justify-content-center g-4">
            <!-- Columna del Formulario -->
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Completa tus datos</h5>
                    </div>
                    <div class="card-body">
                        <!-- Formulario con validaciones HTML5 -->
                        <form id="registrationForm" novalidate>
                            <!-- Tipo: Text con pattern y longitudes -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre"
                                       minlength="3"
                                       maxlength="50"
                                       required>
                                <div class="invalid-feedback" id="nombreFeedback"></div>
                            </div>

                            <!-- Tipo: Email con validacion estricta -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electronico</label>
                                <input type="email" class="form-control" id="email"
                                       maxlength="100"
                                       required>
                                <div class="invalid-feedback" id="emailFeedback"></div>
                            </div>

                            <!-- Tipo: Number con limites (min y max) -->
                            <div class="mb-3">
                                <label for="edad" class="form-label">Edad</label>
                                <input type="number" class="form-control" id="edad"
                                       min="18"
                                       max="120"
                                       required>
                                <div class="invalid-feedback" id="edadFeedback"></div>
                            </div>

                            <!-- Tipo: Select -->
                            <div class="mb-3">
                                <label for="pais" class="form-label">Pais de Residencia</label>
                                <select class="form-select" id="pais" required>
                                    <option value="" selected disabled>Selecciona un pais...</option>
                                    <option value="Argentina">Argentina</option>
                                    <option value="Uruguay">Uruguay</option>
                                    <option value="Chile">Chile</option>
                                    <option value="Otro">Otro</option>
                                </select>
                                <div class="invalid-feedback" id="paisFeedback"></div>
                            </div>

                            <!-- Tipo: Radio -->
                            <div class="mb-3">
                                <label class="form-label d-block">Genero</label>
                                <div class="form-options">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="genero" id="generoM" value="Masculino" required>
                                        <label class="form-check-label" for="generoM">Masculino</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="genero" id="generoF" value="Femenino">
                                        <label class="form-check-label" for="generoF">Femenino</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="genero" id="generoX" value="Otro">
                                        <label class="form-check-label" for="generoX">Otro</label>
                                    </div>
                                </div>
                                <div class="invalid-feedback d-block" id="generoFeedback"></div>
                            </div>

                            <!-- Tipo: Checkbox -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="terminos" required>
                                <label class="form-check-label" for="terminos">Acepto los terminos y condiciones</label>
                                <div class="invalid-feedback" id="terminosFeedback"></div>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Registrar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna de Resultados Dinamicos -->
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm h-100 sticky-top results-card" style="top: 20px;">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="card-title mb-0">Usuarios Registrados</h5>
                    </div>
                    <div class="card-body">
                        <!-- Aqui se inyectaran los datos desde el JS -->
                        <div id="resultsContainer" class="d-flex flex-column gap-3">
                            <p class="text-muted text-center mt-4" id="emptyMessage">No hay usuarios registrados aun.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Espacio extra para probar el scroll -->
        <div class="d-none d-md-flex align-items-end justify-content-center pb-5" style="height: 500px;">
            <p class="text-muted">Fin del documento</p>
        </div>
    </div>

    <!-- Boton Top Scroll -->
    <button id="scrollTopBtn" class="btn btn-primary rounded-circle p-3 shadow" aria-label="Volver arriba">&uarr;</button>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script principal usando modulos -->
    <script type="module" src="/js/main.js"></script>
</body>
</html>
