<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de API - GET & POST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
        <div class="container container-max">
            <span class="navbar-brand fw-bold">Proyecto API</span>
            <button class="btn btn-outline-secondary" id="theme-toggle">🌙 Modo Noche</button>
        </div>
    </nav>

    <main class="container container-max mt-5 px-3">
        
        <div class="row g-5">
            <div class="col-12 col-lg-4">
                <div class="card form-card border-0 shadow-sm p-4">
                    <h2 class="h4 fw-bold mb-3">Registrar Usuario</h2>
                    <p class="text-muted small">Envía datos a la API mediante una petición POST.</p>
                    
                    <form id="user-form" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="input-name" class="form-label small fw-semibold">Nombre</label>
                            <input type="text" class="form-control" id="input-name" placeholder="Ej. Juan Pérez" required minlength="3">
                            <div class="invalid-feedback">El nombre debe tener al menos 3 caracteres.</div>
                        </div>
                        <div class="mb-3">
                            <label for="input-email" class="form-label small fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="input-email" placeholder="ejemplo@correo.com" required>
                            <div class="invalid-feedback">Por favor, ingresa un correo electrónico válido.</div>
                        </div>
                        <button type="submit" id="btn-submit" class="btn btn-primary w-100 shadow-sm mt-2">Enviar con POST</button>
                    </form>

                    <div id="response-container" class="mt-4 d-none"></div>
                </div>
            </div>

            <div class="col-12 col-lg-8">
                <div class="d-flex flex-sm-row flex-column justify-content-between align-items-sm-center gap-3 mb-4">
                    <div>
                        <h2 class="h4 fw-bold mb-1">Directorio de Usuarios</h2>
                        <p class="text-muted small mb-0">Obtención de datos remotos (GET).</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="btn-fetch" class="btn btn-outline-primary btn-sm px-3 shadow-sm">Cargar con Fetch</button>
                        <button id="btn-axios" class="btn btn-outline-success btn-sm px-3 shadow-sm">Cargar con Axios</button>
                    </div>
                </div>

                <div id="loader" class="text-center d-none my-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>

                <div id="users-container" class="row g-3 pb-5"></div>
            </div>
        </div>
    </main>
    <button id="btn-scroll-top" class="btn btn-primary rounded-circle shadow" aria-label="Volver arriba">
        ⬆️
    </button>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/script.js"></script>
</body>
</html>
