<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de API - Fetch & Axios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
        <div class="container container-max">
            <span class="navbar-brand fw-bold">Proyecto API</span>
            <button class="btn btn-outline-secondary" id="theme-toggle">🌙 Modo Noche</button>
        </div>
    </nav>

    <main class="container container-max mt-5 px-3">
        <div class="text-center mb-5">
            <h1 class="display-6 fw-bold">Directorio de Usuarios</h1>
            <p class="text-muted">Demostración de consumo asíncrono utilizando Fetch y Axios de forma modular.</p>
            
            <div class="d-flex justify-content-center gap-3 mt-4">
                <button id="btn-fetch" class="btn btn-primary px-4 shadow-sm">Cargar con Fetch</button>
                <button id="btn-axios" class="btn btn-success px-4 shadow-sm">Cargar con Axios</button>
            </div>
        </div>

        <div id="loader" class="text-center d-none my-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>

        <div id="users-container" class="row g-4 pb-5"></div>
    </main>
    <button id="btn-scroll-top" class="btn btn-primary rounded-circle shadow" aria-label="Volver arriba">
        ⬆️
    </button>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/script.js"></script>
</body>
</html>
