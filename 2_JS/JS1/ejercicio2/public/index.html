<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Dinámico | Lab Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css"> 
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
                <i class="bi bi-box2-fill text-primary"></i> Lab Web | Gestión de Inventario
            </span>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1 fade-in">
        <div class="text-center mb-5">
            <h2 class="fw-bold"><i class="bi bi-database-fill-add text-accent"></i> Registro Multidatos</h2>
            <p class="text-muted">Formulario de 8 campos con selección de método de almacenamiento en Array.</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card card-pro p-3 sticky-top" style="top: 80px; z-index: 10;">
                    <div class="card-body">
                        <h5 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-ui-checks"></i> Ingreso de Artículo</h5>
                        
                        <form id="formInventario" novalidate>
                            <div class="row g-2">
                                <div class="col-md-12 mb-2">
                                    <label class="form-label small fw-bold">1. Nombre del Artículo</label>
                                    <input type="text" class="form-control form-control-sm" name="nombre" required placeholder="Ej: Raqueta de Tenis">
                                </div>
                                
                                <div class="col-md-6 mb-2">
                                    <label class="form-label small fw-bold">2. Categoría</label>
                                    <select class="form-select form-select-sm" name="categoria" required>
                                        <option value="" selected disabled>Elegir...</option>
                                        <option value="Deportes">⚽ Deportes</option>
                                        <option value="Herramientas">🛠️ Herramientas</option>
                                        <option value="Electrónica">💻 Electrónica</option>
                                        <option value="Hogar">🏠 Hogar</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-2">
                                    <label class="form-label small fw-bold">3. Marca</label>
                                    <input type="text" class="form-control form-control-sm" name="marca" required placeholder="Ej: Wilson">
                                </div>

                                <div class="col-md-6 mb-2">
                                    <label class="form-label small fw-bold">4. Precio ($)</label>
                                    <input type="number" step="0.01" class="form-control form-control-sm" name="precio" required min="1" placeholder="0.00">
                                </div>

                                <div class="col-md-6 mb-2">
                                    <label class="form-label small fw-bold">5. Stock (Cant)</label>
                                    <input type="number" class="form-control form-control-sm" name="stock" required min="1" placeholder="Ej: 10">
                                </div>

                                <div class="col-md-6 mb-2">
                                    <label class="form-label small fw-bold">6. Condición</label>
                                    <select class="form-select form-select-sm" name="estado" required>
                                        <option value="Nuevo" selected>✨ Nuevo</option>
                                        <option value="Usado">📦 Usado</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-2">
                                    <label class="form-label small fw-bold">7. Código SKU</label>
                                    <input type="text" class="form-control form-control-sm" name="sku" required pattern="^[a-zA-Z0-9]+$" placeholder="Ej: DEP001">
                                </div>

                                <div class="col-md-12 mb-3">
                                    <label class="form-label small fw-bold">8. Fecha de Ingreso</label>
                                    <input type="date" class="form-control form-control-sm" name="fecha" required id="inputFecha">
                                </div>

                                <div class="col-md-12 mb-3 p-2 bg-body-tertiary rounded border">
                                    <label class="form-label small fw-bold text-primary"><i class="bi bi-cpu"></i> Método de Guardado en Array</label>
                                    <select class="form-select form-select-sm border-primary" name="metodoGuardado" required>
                                        <option value="push" selected>push() - Mandar al Final</option>
                                        <option value="unshift">unshift() - Mandar al Principio</option>
                                        <option value="splice">splice() - Insertar a la Mitad</option>
                                    </select>
                                </div>
                            </div>
                            
                            <button class="btn btn-primary w-100" type="submit"><i class="bi bi-save2"></i> Guardar en Inventario</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0"><i class="bi bi-grid-fill text-secondary"></i> Vista en Tiempo Real</h5>
                    <span class="badge bg-secondary" id="contadorItems">0 ítems</span>
                </div>
                
                <div id="emptyState" class="text-center text-muted py-5 card card-pro bg-transparent border-dashed">
                    <i class="bi bi-inbox fs-1"></i>
                    <p class="mb-0 mt-2">El array está vacío. Llena el formulario.</p>
                </div>

                <div class="row g-3" id="contenedorInventario">
                    </div>
            </div>
        </div>
    </main>

    <button class="btn btn-dark rounded-circle shadow position-fixed bottom-0 start-0 m-4 d-flex align-items-center justify-content-center btn-flotante" id="themeToggleBtn"><i class="bi bi-moon-stars fs-5" id="themeIcon"></i></button>
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1060;">
        <div id="liveToast" class="toast align-items-center border-0 text-white" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex"><div class="toast-body d-flex align-items-center gap-2"><i id="toastIcon" class="bi"></i><span id="toastMessage"></span></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/script.js"></script>
</body>
</html>
