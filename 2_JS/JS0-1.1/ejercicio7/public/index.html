<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 | Lab Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        /* Animación para resaltar el elemento encontrado */
        .highlight-found {
            box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.5) !important;
            transform: scale(1.05);
            transition: all 0.3s ease;
            z-index: 10;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
                <i class="bi bi-braces text-primary"></i> Lab Web | Ejercicio 7
            </span>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1 fade-in">
        <div class="text-center mb-5">
            <h2 class="fw-bold"><i class="bi bi-search text-info"></i> Ejercicio 7: Método indexOf()</h2>
            <p class="text-muted">Buscando posiciones. Devuelve el <strong>índice</strong> si existe, o <strong>-1</strong> si no lo encuentra.</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-4 col-md-6">
                <div class="card card-pro h-100 p-3">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold"><i class="bi bi-fonts text-danger"></i> 1. Palabras</h5>
                        <p class="text-muted small mb-3">Encuentra la posición de "perro".</p>
                        
                        <form id="formPalabras" class="mb-3" novalidate>
                            <div class="input-group input-group-sm has-validation">
                                <input type="text" class="form-control" id="inputPalabras" required pattern="^[a-zA-ZÀ-ÿ]+$" placeholder="Sumar palabra...">
                                <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-plus"></i></button>
                            </div>
                        </form>
                        
                        <div class="p-2 bg-body-tertiary rounded flex-grow-1 mb-2 border border-secondary-subtle">
                            <div id="arrayPalabras" class="d-flex flex-wrap gap-2"></div>
                        </div>

                        <div id="resPalabras" class="alert py-2 small text-center d-none mb-3"></div>

                        <button class="btn btn-danger w-100 mt-auto" id="btnBuscarPerro">
                            <i class="bi bi-search"></i> Buscar "perro"
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6">
                <div class="card card-pro h-100 p-3">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold"><i class="bi bi-123 text-primary"></i> 2. Números</h5>
                        <p class="text-muted small mb-3">Verifica si el 50 está y en qué posición.</p>
                        
                        <form id="formNumeros" class="mb-3" novalidate>
                            <div class="input-group input-group-sm has-validation">
                                <input type="number" class="form-control" id="inputNumeros" required placeholder="Sumar número...">
                                <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-plus"></i></button>
                            </div>
                        </form>
                        
                        <div class="p-2 bg-body-tertiary rounded flex-grow-1 mb-2 border border-secondary-subtle">
                            <div id="arrayNumeros" class="d-flex flex-wrap gap-2"></div>
                        </div>

                        <div id="resNumeros" class="alert py-2 small text-center d-none mb-3"></div>

                        <button class="btn btn-primary text-white w-100 mt-auto" id="btnBuscar50">
                            <i class="bi bi-search"></i> Buscar 50
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6">
                <div class="card card-pro h-100 p-3">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold"><i class="bi bi-buildings-fill text-success"></i> 3. Ciudades</h5>
                        <p class="text-muted small mb-3">Muestra el índice de "Madrid" o un mensaje.</p>
                        
                        <form id="formCiudades" class="mb-3" novalidate>
                            <div class="input-group input-group-sm has-validation">
                                <input type="text" class="form-control" id="inputCiudades" required pattern="^[a-zA-ZÀ-ÿ\s]+$" placeholder="Sumar ciudad...">
                                <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-plus"></i></button>
                            </div>
                        </form>
                        
                        <div class="p-2 bg-body-tertiary rounded flex-grow-1 mb-2 border border-secondary-subtle">
                            <div id="arrayCiudades" class="d-flex flex-wrap gap-2"></div>
                        </div>

                        <div id="resCiudades" class="alert py-2 small text-center d-none mb-3 fw-bold"></div>

                        <button class="btn btn-success w-100 mt-auto" id="btnBuscarMadrid">
                            <i class="bi bi-search"></i> Buscar "Madrid"
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <button class="btn btn-dark rounded-circle shadow position-fixed bottom-0 start-0 m-4 d-flex align-items-center justify-content-center btn-flotante" id="themeToggleBtn"><i class="bi bi-moon-stars fs-5" id="themeIcon"></i></button>
    <button class="btn btn-primary rounded-circle shadow position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center btn-flotante d-none" id="scrollTopBtn"><i class="bi bi-arrow-up fs-5"></i></button>
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1060;">
        <div id="liveToast" class="toast align-items-center border-0 text-white" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex"><div class="toast-body d-flex align-items-center gap-2"><i id="toastIcon" class="bi"></i><span id="toastMessage"></span></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/script.js"></script>
</body>
</html>
