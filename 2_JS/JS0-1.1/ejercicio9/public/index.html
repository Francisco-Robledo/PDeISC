<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 | Lab Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
                <i class="bi bi-braces text-primary"></i> Lab Web | Ejercicio 9
            </span>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1 fade-in">
        <div class="text-center mb-5">
            <h2 class="fw-bold"><i class="bi bi-arrow-repeat text-danger"></i> Ejercicio 9: Método forEach()</h2>
            <p class="text-muted">Iterando sobre los elementos para ejecutar acciones individuales.</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-4 col-md-6">
                <div class="card card-pro h-100 p-3">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold"><i class="bi bi-chat-heart text-danger"></i> 1. Saludos</h5>
                        <p class="text-muted small mb-3">Muestra los nombres con un saludo.</p>
                        
                        <form id="formNombres" class="mb-3" novalidate>
                            <div class="input-group input-group-sm has-validation">
                                <input type="text" class="form-control" id="inputNombres" required pattern="^[a-zA-ZÀ-ÿ\s]+$" placeholder="Agregar nombre...">
                                <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-plus"></i></button>
                            </div>
                        </form>
                        
                        <div class="p-2 bg-body-tertiary rounded flex-grow-1 mb-2 border border-secondary-subtle">
                            <div id="arrayNombres" class="d-flex flex-wrap gap-2"></div>
                        </div>

                        <div id="resNombres" class="alert alert-danger py-2 small d-none mb-3 lh-sm text-start"></div>

                        <button class="btn btn-danger w-100 mt-auto" id="btnForEachNombres">
                            <i class="bi bi-play-circle"></i> Ejecutar forEach()
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6">
                <div class="card card-pro h-100 p-3">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold"><i class="bi bi-calculator-fill text-primary"></i> 2. El Doble</h5>
                        <p class="text-muted small mb-3">Imprime el doble de cada número.</p>
                        
                        <form id="formNumeros" class="mb-3" novalidate>
                            <div class="input-group input-group-sm has-validation">
                                <input type="number" class="form-control" id="inputNumeros" required placeholder="Agregar número...">
                                <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-plus"></i></button>
                            </div>
                        </form>
                        
                        <div class="p-2 bg-body-tertiary rounded flex-grow-1 mb-2 border border-secondary-subtle">
                            <div id="arrayNumeros" class="d-flex flex-wrap gap-2"></div>
                        </div>

                        <div id="resNumeros" class="alert alert-primary py-2 small d-none mb-3 lh-sm text-start"></div>

                        <button class="btn btn-primary text-white w-100 mt-auto" id="btnForEachNumeros">
                            <i class="bi bi-play-circle"></i> Ejecutar forEach()
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6">
                <div class="card card-pro h-100 p-3">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold"><i class="bi bi-filetype-json text-success"></i> 3. Objetos { }</h5>
                        <p class="text-muted small mb-3">Muestra nombre y edad de cada objeto.</p>
                        
                        <form id="formPersonas" class="mb-3" novalidate>
                            <div class="row g-2 mb-2">
                                <div class="col-7">
                                    <input type="text" class="form-control form-control-sm" id="inputPersonaNombre" required pattern="^[a-zA-ZÀ-ÿ\s]+$" placeholder="Nombre">
                                </div>
                                <div class="col-5">
                                    <input type="number" class="form-control form-control-sm" id="inputPersonaEdad" required min="1" max="120" placeholder="Edad">
                                </div>
                            </div>
                            <button class="btn btn-outline-secondary w-100 btn-sm" type="submit"><i class="bi bi-plus"></i> Sumar Objeto</button>
                        </form>
                        
                        <div class="p-2 bg-body-tertiary rounded flex-grow-1 mb-2 border border-secondary-subtle">
                            <div id="arrayPersonas" class="d-flex flex-column gap-2"></div>
                        </div>

                        <div id="resPersonas" class="alert alert-success py-2 small d-none mb-3 lh-sm text-start"></div>

                        <button class="btn btn-success w-100 mt-auto" id="btnForEachPersonas">
                            <i class="bi bi-play-circle"></i> Ejecutar forEach()
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <button class="btn btn-dark rounded-circle shadow position-fixed bottom-0 start-0 m-4 d-flex align-items-center justify-content-center btn-flotante" id="themeToggleBtn"><i class="bi bi-moon-stars fs-5" id="themeIcon"></i></button>
    <button class="btn btn-primary rounded-circle shadow position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center btn-flotante d-none" id="scrollTopBtn"><i class="bi bi-arrow-up fs-5"></i></button>
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1060;">
        <div id="liveToast" class="toast align-items-center border-0 text-white" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex"><div class="toast-body d-flex align-items-center gap-2"><i id="toastIcon" class="bi"></i><span id="toastMessage"></span></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/script.js"></script>
</body>
</html>
